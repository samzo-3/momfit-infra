
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: momfit-app
  namespace: flux-system
spec:
  interval: 5m
  path: ./apps/momfit
  prune: false
  suspend: false

  sourceRef:
    kind: GitRepository
    name: flux-system

  targetNamespace: team

  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: momfit-frontend
      namespace: team

    - apiVersion: apps/v1
      kind: Deployment
      name: momfit-backend
      namespace: team
