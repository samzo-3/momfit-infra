apiVersion: apps/v1
kind: Deployment
metadata:
  name: momfit-backend
  namespace: team
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: momfit-backend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-21T09:38:27+09:00"
      labels:
        app: momfit-backend
    spec:
      containers:
      - env:
        - name: COOKIE_SECURE
          value: "false"
        envFrom:
        - secretRef:
            name: momfit-backend-env
        image: ghcr.io/samzo-3/momfit-backend:develop-6 # {"$imagepolicy": "flux-system:momfit-backend"}
        imagePullPolicy: Always
        name: backend
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /api/health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 128Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: ghcr-auth
      nodeSelector:
        kubernetes.io/hostname: t3-w1
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
